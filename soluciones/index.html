    #rusbelt-reference-preview .category-row{display:grid;grid-template-columns:repeat(4,1fr);gap:5px;margin-top:9px}
    #rusbelt-reference-preview .category{border:1px solid #d2d2d7;border-radius:17px;background:#f9f9fa;color:#77777e;height:54px;padding:5px 1px;font-size:9px;line-height:1.2;cursor:pointer}

    #rusbelt-reference-preview .sector.medium:after{content:"";width:55px;height:55px;position:absolute;bottom:6px;right:-2px;border-radius:50%;background:radial-gradient(circle at 25% 25%,#ffe7da,#bda6a6 67%,#8f858e);box-shadow:-12px 16px 0 -6px #81acbb}
    #rusbelt-reference-preview .sector.small{display:flex;align-items:center;justify-content:space-around;padding:9px}
    #rusbelt-reference-preview .sector.small h3{margin:0;font-size:14px;max-width:100px}
    #rusbelt-reference-preview .sector.small .sparkles{display:flex;gap:4px;align-self:flex-end}
    #rusbelt-reference-preview .sector.small .sparkles i{font-style:normal;border-radius:50%;background:rgba(255,255,255,.54);width:21px;height:21px;text-align:center;line-height:21px;font-size:12px}
    #rusbelt-reference-preview .bottom-nav{position:absolute;bottom:17px;left:17px;right:17px;height:55px;border-radius:32px;background:#111116;color:#eeeef0;display:grid;grid-template-columns:repeat(4,1fr);align-items:center;text-align:center}
    #rusbelt-reference-preview .bottom-nav span{font-size:19px;font-weight:300}
    #rusbelt-reference-preview .bottom-nav .selected{height:50px;width:50px;border-radius:50%;background:#f7f7f8;color:#111116;display:grid;place-items:center;border:2px solid #111116;margin-left:3px}
    #rusbelt-reference-preview .home-indicator{position:absolute;bottom:4px;width:116px;height:4px;border-radius:6px;background:#101013;left:50%;transform:translateX(-50%)}
    #rusbelt-reference-preview .poster-foot{position:absolute;bottom:0;left:0;right:0;height:92px;background:#bfb3f3;display:flex;align-items:center;justify-content:space-between;padding:0 37px;color:#fff}
    #rusbelt-reference-preview .poster-foot .mark{font-size:27px;opacity:.76;font-weight:700}
    #rusbelt-reference-preview .poster-foot small{font-size:17px;opacity:.8}
    #rusbelt-reference-preview .poster-foot .round{height:72px;width:72px;border-radius:23px;background:#030307;display:grid;place-items:center;font-size:31px;color:white}

    @media(max-width:480px){#rusbelt-reference-preview .poster{width:100%;height:880px;border-radius:25px}#rusbelt-reference-preview .device{transform:scale(.89);transform-origin:top center;top:100px}#rusbelt-reference-preview .poster-foot{height:80px;padding:0 25px}#rusbelt-reference-preview .poster-foot .round{width:61px;height:61px}}
    @media(max-width:350px){#rusbelt-reference-preview .poster{height:780px}#rusbelt-reference-preview .device{transform:scale(.78);top:84px}#rusbelt-reference-preview .poster-foot{height:67px}}

    #rusbelt-reference-preview{font-family:"Aptos","Segoe UI",Arial,sans-serif}
    #rusbelt-reference-preview .device{height:710px}
    #rusbelt-reference-preview .notch{top:10px}
    #rusbelt-reference-preview .greeting{height:58px}
    #rusbelt-reference-preview .hero{margin-top:5px}
    #rusbelt-reference-preview .hero strong{font-family:"Aptos","Segoe UI",Arial,sans-serif;font-size:22px;line-height:1.08;letter-spacing:-.7px;font-weight:750}
    #rusbelt-reference-preview .hello{font-size:12px;line-height:1.4}
    #rusbelt-reference-preview .category{font-family:inherit;line-height:1.3;font-size:9px}
    #rusbelt-reference-preview .category b{font-size:9px;font-weight:500}
    #rusbelt-reference-preview .plan-heading{margin:15px 0 12px}
    #rusbelt-reference-preview .plan-heading strong{font-weight:750;letter-spacing:-.4px}
    #rusbelt-reference-preview .sector{padding:13px}
    #rusbelt-reference-preview .sector h3{font-family:"Aptos","Segoe UI",Arial,sans-serif;font-weight:750;font-size:15px;line-height:1.22;letter-spacing:-.3px;margin:10px 0 7px;position:relative;z-index:1;text-align:left}
    #rusbelt-reference-preview .sector.large h3{font-size:18px;line-height:1.2;margin-top:17px}
    #rusbelt-reference-preview .sector p{font-size:10px;line-height:1.45;text-align:justify;hyphens:auto;position:relative;z-index:1;max-width:100%}
    #rusbelt-reference-preview .sector.medium p{max-width:90px}
    #rusbelt-reference-preview .sector.medium:after{opacity:.45;width:43px;height:43px;bottom:5px}

    #rusbelt-reference-preview .bottom-nav{bottom:19px}
  #rusbelt-reference-preview a{color:inherit;text-decoration:none}#rusbelt-reference-preview .bottom-nav a{display:grid;place-items:center;font-size:21px;min-height:44px}#rusbelt-reference-preview .sector:focus-visible{outline:3px solid #493281;outline-offset:2px}body{margin:0;background:#ded9f5} </style>
  <div class="poster" aria-label="Vista previa: Ideas para tu negocio con la composición de la referencia">
    <div class="poster-back" aria-hidden="true">‹</div>
    <div class="device"><div class="screen" lang="es">
      <div class="notch" aria-hidden="true"></div>
      <div class="statusbar"><span>9:41</span><span class="status-icons">▴ ▰ ▰</span></div>
      <div class="greeting"><span class="avatar" aria-hidden="true"></span><div class="hello">Hola, bienvenido<small>Ideas para tu negocio</small></div><span class="search" aria-hidden="true">⌕</span></div>
      <div class="hero"><strong>Ideas para tu negocio</strong><p>Descubre lo que podemos crear para ti.</p><div class="mini-people" aria-hidden="true"><span></span><span></span><span></span><span>+14</span></div><div class="sculpture" aria-hidden="true"><span class="ring one"></span><span class="ring two"></span><span class="cube a"></span><span class="cube b"></span><span class="ring three"></span></div></div>
      <div class="category-row" role="group" aria-label="Tipos de negocio"><button type="button" class="category" data-kind="comercios" aria-pressed="false"><em></em>Comercios<b>Tiendas</b></button><button type="button" class="category" data-kind="servicios" aria-pressed="true"><em></em>Servicios<b>Locales</b></button><button type="button" class="category" data-kind="comida" aria-pressed="false"><em></em>Comida<b>y hotel</b></button><button type="button" class="category" data-kind="salud" aria-pressed="false"><em></em>Salud<b>y centros</b></button></div>
      <div class="plan-heading"><strong>Elige tu negocio</strong><button type="button" id="ref-page" aria-label="Mostrar más negocios">1 de 2 ›</button></div>
      <div class="cards" id="ref-cards" aria-live="polite"></div>

      <div class="home-indicator" aria-hidden="true"></div>
    </div></div>
    <div class="poster-foot"><span class="mark">◌</span><small>rusbelt. · soluciones para negocios</small><span class="round">✦</span></div>
  </div>
  <script>
    (()=>{const root=document.getElementById('rusbelt-reference-preview'),cards=root.querySelector('#ref-cards'),pageLabel=root.querySelector('#ref-page');
      const groups={
        servicios:[['Gimnasios','Mejora el seguimiento y las clases.'],['Barberías','Organiza tu agenda.'],['Salones','Organiza citas y recursos.'],['Talleres','Trabajos y piezas']],
        comercios:[['Licorerías','Ofertas y rotación'],['Teléfonos','Modelos y accesorios'],['Ropa y calzado','Tallas y existencias'],['Farmacias','Vencimientos y compras'],['Minimarkets','Productos y ventas'],['Gasolineras','Disponibilidad y turnos']],
        comida:[['Restaurantes','Menú y pedidos'],['Hoteles','Habitaciones y tarifas']],
        salud:[['Consultorios','Huecos y retrasos'],['Hospitales','Turnos y servicios']]
      };
      const routes={"Gimnasios":"gimnasios/","Barberías":"barberias/","Salones":"salones/","Talleres":"repuestos-talleres/","Licorerías":"licorerias/","Teléfonos":"telefonos/","Ropa y calzado":"ropa-calzado/","Farmacias":"farmacias/","Minimarkets":"minimarkets/","Gasolineras":"gasolineras/","Restaurantes":"restaurantes/","Hoteles":"hoteles/","Consultorios":"consultorios/","Hospitales":"hospitales/"};let kind='servicios',page=0;function paint(){
        const items=groups[kind],max=Math.ceil(items.length/3);if(page>=max)page=0;
        const showing=items.slice(page*3,page*3+3);cards.replaceChildren();
        showing.forEach(([name,detail],i)=>{const card=document.createElement('a');card.href=routes[name];card.className='sector '+['large','medium','small'][i];const pill=document.createElement('span');pill.className='pill';pill.textContent=i===0?'Explorar':'Demo';const title=document.createElement('h3');title.textContent=name;const desc=document.createElement('p');desc.textContent=detail;card.append(pill,title,desc);if(i===0){const open=document.createElement('span');open.className='open';open.textContent='Probar soluciones ↗';card.append(open)}if(i===2){const icon=document.createElement('span');icon.className='sparkles';icon.innerHTML='<i>◌</i><i>↗</i>';card.append(icon)}cards.append(card)});
        if(showing.length<3){const more=document.createElement('div');more.className='sector small';const title=document.createElement('h3');title.textContent='¿Otro tipo de negocio?';more.append(title);cards.append(more)}
        pageLabel.textContent=max>1?(page+1)+' de '+max+' ›':'1 de 1';
        pageLabel.disabled=max===1;
        [...root.querySelectorAll('.category')].forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.kind===kind)));
      }
      root.querySelectorAll('.category').forEach(button=>button.addEventListener('click',()=>{kind=button.dataset.kind;page=0;paint()}));
      pageLabel.addEventListener('click',()=>{const max=Math.ceil(groups[kind].length/3);page=(page+1)%max;paint()});
      paint();
    })();
  </script>
</div>
